<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granth Mitra - Educational Initiative of Akanksha Charitable Trust (ACT)</title>
    <!-- Stable Production Tailwind CSS Framework Link -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <!-- FontAwesome for Premium NGO UI Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
        .glow-subtle { box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.12); }
        .brush-ring-container { position: relative; width: 100%; max-width: 440px; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
        .brush-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-5deg); pointer-events: none; }
        .floating-badge { position: absolute; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border: 1px solid #f1f5f9; padding: 12px 18px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); display: flex; align-items: center; gap: 10px; animation: float-slow 4s ease-in-out infinite; z-index: 20; }
        @keyframes float-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .testimonial-slider { display: flex; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .admin-panel-layer { position: fixed; inset: 0; background-color: #f1f5f9; z-index: 200; display: none; flex-direction: column; }
    </style>
</head>
<body class="antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <!-- 🏢 DUAL-BRANDED HEADER NAVIGATION BAR -->
    <header class="bg-white border-b border-slate-200/80 sticky top-0 z-40 shadow-xs" style="background-color: rgba(255,255,255,0.96);">
        <div class="max-w-7xl mx-auto px-6 h-24 flex justify-between items-center">
            
            
            <div class="flex items-center space-x-3.5">
                <!-- Dynamic Replaceable Footer/Header Brand Logo Image Tag Slot -->
                <div class="w-12 h-12 flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl overflow-hidden shadow-md shadow-indigo-100">
                    <img id="display-brandLogoNav" src="logo.png" alt="ACT" class="w-full h-full object-contain" onerror="this.style.display='none'; this.parentNode.innerHTML='📚';"/>
                </div>
                <div class="flex flex-col">
                    <span class="text-base font-extrabold text-slate-900 tracking-tight leading-none">GRANTH MITRA | ಗ್ರಂಥಮಿತ್ರ</span>
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest leading-none mt-1.5">Initiative of Akanksha Charitable Trust</span>
                </div>
            </div>

            <!-- Central Section Navigation Router Links -->
            <nav class="hidden lg:flex items-center space-x-7 text-xs uppercase tracking-wider font-bold text-slate-600">
                <a href="#" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">Home</a>
                <a href="#about" class="hover:text-indigo-600 transition">About Programme</a>
                <a href="#areas" class="hover:text-indigo-600 transition">Syllabus Areas</a>
                <a href="#impact" class="hover:text-indigo-600 transition">Our Impact</a>
                <a href="#events" class="hover:text-indigo-600 transition">Events Feed</a>
                <a href="#resources" class="hover:text-indigo-600 transition">Resources</a>
            </nav>

            <!-- Far Right Gateway Modal Popup Launcher -->
            <div>
                <button onclick="toggleAuthPopup(true)" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white text-xs font-bold uppercase tracking-wider px-6 py-3.5 rounded-full shadow-md shadow-indigo-100 transition transform hover:-translate-y-0.5 flex items-center gap-2">
                    <i class="fa-solid fa-circle-user text-sm"></i> <span>Portal Login</span>
                </button>
            </div>

        </div>
    </header>
