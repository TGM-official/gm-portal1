<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granth Mitra - Educational Initiative of Akanksha Charitable Trust</title>
    <!-- Stable Production Tailwind CSS Framework Link -->
    <link href="https://cloudflare.com" rel="stylesheet">
    <!-- FontAwesome CDN Link for Modern UI Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans m-0 p-0" style="background-color: #f8fafc;">

    <!-- 🏢 DUAL-BRANDED HEADER NAVIGATION BAR -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-xs" style="background-color: rgba(255,255,255,0.95);">
        <div class="max-w-7xl mx-auto px-6 h-24 flex justify-between items-center">
            
            <!-- Branding Configuration (ACT + Granth Mitra) -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white text-lg font-black shadow-md shadow-blue-200" style="background-image: linear-gradient(to bottom right, #4f46e5, #7c3aed);">
                    <i class="fa-solid fa-book-open-reader"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-base font-extrabold text-gray-900 tracking-tight leading-tight">GRANTH MITRA | ಗ್ರಂಥಮಿತ್ರ</span>
                    <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest leading-none mt-1">Initiative of Akanksha Charitable Trust</span>
                </div>
            </div>

            <!-- Public Portal Section Links -->
            <nav class="hidden lg:flex items-center space-x-6 text-xs uppercase tracking-wider font-bold text-gray-600">
                <a href="#" class="text-blue-600 border-b-2 border-blue-600 pb-1" style="color: #4f46e5; border-color: #4f46e5;">Home</a>
                <a href="#about" class="hover:text-blue-600 transition" style="color: #4b5563;">About</a>
                <a href="#areas" class="hover:text-blue-600 transition" style="color: #4b5563;">Syllabus</a>
                <a href="#impact" class="hover:text-blue-600 transition" style="color: #4b5563;">Impact</a>
                <a href="#footer" class="hover:text-blue-600 transition" style="color: #4b5563;">Contact</a>
            </nav>

            <!-- Login Gateway Modal Trigger -->
            <div>
                <button class="text-white text-xs font-bold uppercase tracking-wider px-6 py-3 rounded-full shadow-md transition transform hover:-translate-y-0.5 flex items-center space-x-2" style="background-image: linear-gradient(to right, #4f46e5, #7c3aed);">
                    <i class="fa-solid fa-circle-user text-sm"></i> <span>Portal Login</span>
                </button>
            </div>

        </div>
    </header>

    <!-- Temp Verification Content Container -->
    <div class="p-12 text-center">
        <h2 class="text-2xl font-black text-gray-900">Navigation Node Verified</h2>
        <p class="text-sm text-gray-500 mt-1">If you see a clean white navigation bar at the top containing headers and a Portal Login button, Step 2 is correct.</p>
    </div>

</body>
</html>
