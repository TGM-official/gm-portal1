<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granth Mitra | Educational Initiative of ACT</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --accent: #7c3aed; --text: #0f172a; --bg: #f8fafc; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        /* 🏢 HEADER: Minimalist Split */
        header { background: #fff; height: 80px; display: flex; align-items: center; border-bottom: 1px solid #e2e8f0; sticky; top: 0; z-index: 1000; padding: 0 5%; justify-content: space-between; }
        .logo-box { width: 110px; height: 60px; background: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; }
        .logo-box img { max-width: 100%; height: auto; }
        
        /* 🎯 HERO: Modern Clean */
        .hero { padding: 100px 5%; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; background: #fff; }
        .hero-text h1 { font-size: 52px; font-weight: 800; line-height: 1.1; margin-bottom: 24px; color: var(--text); }
        .hero-img-container { position: relative; display: flex; justify-content: center; }
        .circle-mask { width: 400px; height: 400px; border-radius: 50%; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.1); border: 8px solid #fff; }
        .circle-mask img { width: 100%; height: 100%; object-fit: cover; }

        /* 🔒 MODAL: New Clean Logic */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .modal-card { background: #fff; width: 90%; max-width: 500px; border-radius: 32px; padding: 40px; box-shadow: 0 40px 100px rgba(0,0,0,0.2); position: relative; transform: translateY(20px); transition: 0.3s ease; }
        .btn-portal { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; padding: 14px 32px; border-radius: 100px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; }
        
        /* Badge UI */
        .badge { position: absolute; background: #fff; padding: 12px 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 16px;">
            <div class="logo-box" id="headerLogoContainer">
                <img id="display-brandLogoNav" src="logo.png" onerror="this.parentNode.innerHTML='<b>ACT</b>'">
            </div>
            <div>
                <div style="font-weight: 800; font-size: 20px;">GRANTH MITRA</div>
                <div style="font-size: 11px; color: #64748b; font-weight: 600; text-transform: uppercase;">Akanksha Charitable Trust</div>
            </div>
        </div>
        <button class="btn-portal" onclick="openModal('portalModal')">PORTAL LOGIN</button>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h1>Empowering Rural Education via Mentorship</h1>
            <p style="font-size: 18px; color: #475569; margin-bottom: 40px;">College students mentoring government school students to build a brighter future through literacy and life skills.</p>
            <div style="display: flex; gap: 16px;">
                <button class="btn-portal" onclick="openModal('volModal')">Become a Volunteer</button>
                <button style="border: 2px solid #e2e8f0; background: transparent; padding: 14px 32px; border-radius: 100px; font-weight: 700; cursor: pointer;" onclick="openModal('exploreModal')">Explore Program</button>
            </div>
        </div>
        <div class="hero-img-container">
            <div class="circle-mask">
                <img id="display-heroImg" src="mascot.png" onerror="this.src='https://placeholder.com'">
            </div>
            <div class="badge" style="top: 20px; right: -20px;">💜 Community Driven</div>
            <div class="badge" style="bottom: 20px; left: -20px;">🎓 Education First</div>
        </div>
    </section>

    <!-- Unified Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals(event)">
        <!-- Portal Choice Modal -->
        <div id="portalModal" class="modal-card" style="display: none;">
            <h2>Select Portal</h2>
            <button class="btn-portal" style="width:100%; margin-bottom:10px;" onclick="adminLogin()">Admin Login</button>
            <button class="btn-portal" style="width:100%; background: #0f172a;" onclick="window.open('https://google.com','_blank')">Volunteer Login</button>
        </div>
        
        <!-- Volunteer Form -->
        <div id="volModal" class="modal-card" style="display: none;">
            <h2>Volunteer Application</h2>
            <input type="text" placeholder="Name" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
            <input type="email" placeholder="Email" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
            <select style="width:100%; padding:12px; margin-bottom:20px; border-radius:8px; border:1px solid #ddd;">
                <option>Student</option>
                <option>Teacher</option>
                <option>Professional</option>
            </select>
            <button class="btn-portal" style="width:100%;">Submit Application</button>
        </div>
    </div>

    <script>
        function openModal(id) {
            document.getElementById('modalOverlay').style.display = 'flex';
            document.querySelectorAll('.modal-card').forEach(m => m.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }
        function closeAllModals(e) {
            if(e.target.id === 'modalOverlay') document.getElementById('modalOverlay').style.display = 'none';
        }
        function adminLogin() {
            let pass = prompt("Enter Admin Key:");
            if(pass === "actAdmin2026") alert("Dashboard Unlocked (Feature appending next...)");
        }
    </script>
</body>
</html>
